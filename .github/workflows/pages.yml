# Publica el informe en GitHub Pages.
#
# No compila nada: el sitio ya viene generado en sitio/ y versionado en el
# repositorio. Regenerarlo aquí exigiría instalar Python con scikit-fmm y numba
# en el servidor para producir un resultado que ya está calculado y que es
# determinista — no ganaría nada y sumaría una forma de fallar.
#
# Para regenerarlo, en la máquina de trabajo:
#     py -3.12 experimentos/exportar_sitio.py
# y se sube el resultado como cualquier otro cambio.
name: Publicar el informe

on:
  push:
    branches: [main]
    paths: ["sitio/**", ".github/workflows/pages.yml"]
  workflow_dispatch:          # también se puede lanzar a mano

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos cambios seguidos, se publica el último y se cancela el anterior
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Solo se comprueba lo que de verdad impide publicar y no se puede
      # arreglar desde aquí: que el repositorio sea privado.
      #
      # NO se comprueba que Pages esté "habilitado". La primera versión lo
      # hacía y bloqueaba el despliegue en el único momento en que había que
      # dejarlo pasar: la API /pages devuelve 404 hasta que existe un
      # despliegue exitoso, y quien crea ese primer despliegue es justamente
      # el paso configure-pages de más abajo. Era un círculo vicioso —
      # exigir el resultado antes de permitir la causa.
      # ------------------------------------------------------------------
      - name: Comprobar que el repositorio es público
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibilidad=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)
          tipo=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .owner.type)
          echo "repositorio: $visibilidad"
          if [ "$visibilidad" != "public" ] && [ "$tipo" = "User" ]; then
            echo "::error::El repositorio es $visibilidad. GitHub Pages solo publica repositorios PÚBLICOS en cuentas gratuitas."
            echo "Para arreglarlo: Settings -> General -> Danger Zone -> Change visibility -> Public"
            exit 1
          fi

      - name: Comprobar que el sitio está completo
        # Si falta un archivo, mejor fallar aquí que publicar una página rota
        run: |
          set -e
          for f in sitio/index.html sitio/datos/catalogo.json \
                   sitio/datos/escenarios.json sitio/.nojekyll; do
            test -f "$f" || { echo "::error::Falta $f — corre experimentos/exportar_sitio.py"; exit 1; }
          done
          echo "sitio/: $(find sitio -type f | wc -l) archivos, $(du -sh sitio | cut -f1)"

      - uses: actions/configure-pages@v5
        with:
          # si Pages todavia no existe, lo habilita en vez de fallar
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: despliegue
        uses: actions/deploy-pages@v4

      - name: Dónde quedó
        run: echo "Publicado en ${{ steps.despliegue.outputs.page_url }}"
