# Publica el informe en GitHub Pages.
#
# No compila nada: el sitio ya viene generado en sitio/ y versionado en el
# repositorio. Regenerarlo aquí exigiría instalar Python con scikit-fmm y numba
# en el servidor para producir un resultado que ya está calculado y que es
# determinista — no ganaría nada y sumaría una forma de fallar.
#
# Para regenerarlo, en la máquina de trabajo:
#     py -3.12 experimentos/exportar_sitio.py
# y se sube el resultado como cualquier otro cambio.
name: Publicar el informe

on:
  push:
    branches: [main]
    paths: ["sitio/**", ".github/workflows/pages.yml"]
  workflow_dispatch:          # también se puede lanzar a mano

permissions:
  contents: read
  pages: write
  id-token: write

# Si llegan dos cambios seguidos, se publica el último y se cancela el anterior
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Antes de intentar publicar, comprobar que se PUEDE. Sin esto, el
      # fallo típico es un "Not Found" del paso de despliegue que no dice
      # nada sobre la causa real, que casi siempre es una de dos cosas:
      # el repositorio es privado, o Pages no está puesto en "GitHub Actions".
      # ------------------------------------------------------------------
      - name: Comprobar que Pages está habilitado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          visibilidad=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)
          plan=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.owner.type')
          pages=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null)
          codigo=$?
          set -e

          echo "repositorio: $visibilidad"
          echo "origen de Pages: ${pages:-(sin configurar)}"

          if [ "$visibilidad" != "public" ] && [ "$plan" = "User" ]; then
            echo "::error::El repositorio es $visibilidad. GitHub Pages solo publica repositorios PÚBLICOS en cuentas gratuitas."
            echo ""
            echo "Para arreglarlo:  Settings -> General -> Danger Zone -> Change visibility -> Public"
            exit 1
          fi

          if [ $codigo -ne 0 ] || [ -z "$pages" ]; then
            echo "::error::Pages no está habilitado en este repositorio."
            echo ""
            echo "Para arreglarlo:  Settings -> Pages -> Build and deployment -> Source: GitHub Actions"
            exit 1
          fi

          if [ "$pages" != "workflow" ]; then
            echo "::error::Pages está publicando desde una rama ($pages), no desde Actions, así que este workflow no puede desplegar."
            echo ""
            echo "Para arreglarlo:  Settings -> Pages -> Source: GitHub Actions"
            exit 1
          fi

      - name: Comprobar que el sitio está completo
        # Si falta un archivo, mejor fallar aquí que publicar una página rota
        run: |
          set -e
          for f in sitio/index.html sitio/datos/catalogo.json \
                   sitio/datos/escenarios.json sitio/.nojekyll; do
            test -f "$f" || { echo "::error::Falta $f — corre experimentos/exportar_sitio.py"; exit 1; }
          done
          echo "sitio/: $(find sitio -type f | wc -l) archivos, $(du -sh sitio | cut -f1)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: despliegue
        uses: actions/deploy-pages@v4

      - name: Dónde quedó
        run: echo "Publicado en ${{ steps.despliegue.outputs.page_url }}"
